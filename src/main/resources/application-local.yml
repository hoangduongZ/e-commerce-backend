# Local dev: chạy cùng docker-compose.yml (PostgreSQL + Redis), credential default trong application.yml.
logging:
  level:
    com.electrostore: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway

app:
  cors:
    allowed-origins: http://localhost:3000
