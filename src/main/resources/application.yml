# Config chung mọi môi trường. Secret KHÔNG hard-code — đọc từ env variable.
# Default value chỉ dành cho local dev (trùng docker-compose.yml, không phải secret thật);
# các profile dev/staging/prod bắt buộc set env (không có default).
spring:
  application:
    name: electrostore-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/electrostore}
    username: ${DB_USERNAME:electrostore}
    password: ${DB_PASSWORD:electrostore}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema chỉ thay đổi qua Flyway migration
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info # profile local/dev/staging mở rộng thêm
  endpoint:
    health:
      probes:
        enabled: true # /actuator/health/liveness + /actuator/health/readiness

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
